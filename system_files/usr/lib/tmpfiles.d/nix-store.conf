# Backing store for /nix, which is bind-mounted by nix.mount.
#
# The nix-system RPM creates /nix/store and /nix/var in the image, but on a
# bootc/ostree system that tree lands on the read-only composefs root. Nix needs
# a writable store, so the real content lives on /var (persistent, per-machine)
# and gets bind-mounted over the read-only /nix at boot.
#
# Layout mirrors what nix-system ships, plus daemon-socket, which the RPM does
# not create but nix-daemon.socket requires (ConditionPathIsReadWrite).

d /var/lib/nix                          0755 root root   -
d /var/lib/nix/store                    1775 root nixbld -
d /var/lib/nix/var                      0755 root root   -
d /var/lib/nix/var/nix                  0755 root nixbld -
d /var/lib/nix/var/nix/db               0755 root root   -
d /var/lib/nix/var/nix/daemon-socket    0755 root root   -
d /var/lib/nix/var/nix/gc-socket        0755 root root   -
d /var/lib/nix/var/nix/gcroots          0755 root root   -
d /var/lib/nix/var/nix/gcroots/per-user 1777 root root   -
d /var/lib/nix/var/nix/profiles         0755 root root   -
d /var/lib/nix/var/nix/profiles/per-user 1777 root root  -
d /var/lib/nix/var/nix/temproots        0755 root root   -
d /var/lib/nix/var/log                  0755 root root   -
d /var/lib/nix/var/log/nix              0755 root root   -
d /var/lib/nix/var/log/nix/drvs         0755 root root   -
