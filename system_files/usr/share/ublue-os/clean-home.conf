# Cleanup rules for `ujust clean-home`.
#
# This file is deliberately NOT installed into a systemd-tmpfiles search path
# (/usr/share/user-tmpfiles.d, /etc/xdg/user-tmpfiles.d, ~/.config/user-tmpfiles.d).
# The user instance of systemd-tmpfiles-clean.timer is enabled by default on
# this system, so a config in any of those directories would be applied daily
# on its own. Keeping it here means nothing is ever deleted unless you run the
# just recipe by hand. If you later decide you want it automatic, symlink this
# into ~/.config/user-tmpfiles.d/ and the existing timer picks it up.
#
# Age uses the default field set -- the most recent of atime, btime, ctime and
# mtime -- so anything touched inside the window survives. Note that this is
# why `touch -d '400 days ago'` looks fresh to tmpfiles: touch leaves ctime at
# the current time. Real stale files have all four fields old.

# Trash: entries deleted more than 30 days ago. Safest possible target, since
# everything in here was already explicitly thrown away.
e %h/.local/share/Trash/files - - - 30d
e %h/.local/share/Trash/info  - - - 30d

# Caches older than 30 days. Regenerable by definition -- currently ~20G.
# This includes %h/.cache/nix (nix's eval cache, rebuilt on next evaluation)
# and %h/.cache/mesa_shader_cache (costs some shader recompile stutter once).
e %h/.cache - - - 30d
